[workspace]
name = "whirlwind-trt-plugins"
version = "0.1.0"
description = "TensorRT plugin with kernels for fast inference"
authors = ["Gijs de Jong <gijs@whirlwind.team>"]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64", "linux-aarch64"]

[system-requirements]
cuda = "12.0"

[dependencies]
cmake = ">=3.24"
pkg-config = "*"

# Optional but useful
python = ">=3.10"
numpy = "*"

[tasks]
configure = """
env -u CC -u CXX -u LD CUDAHOSTCXX=/usr/bin/c++ \
cmake -S . -B build -G "Unix Makefiles" \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
  -DCMAKE_CXX_COMPILER=/usr/bin/c++ \
  -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc \
  -DCUDAToolkit_ROOT=/usr/local/cuda
"""

build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
clean = "rm -rf build"
reconfigure = { cmd = "rm -rf build && pixi run configure" }
