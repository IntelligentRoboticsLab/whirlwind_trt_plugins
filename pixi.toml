[workspace]
name = "whirlwind-trt-plugins"
version = "0.1.0"
description = "TensorRT plugin with kernels for fast inference"
authors = ["Gijs de Jong <gijs@whirlwind.team>"]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64", "linux-aarch64"]

[system-requirements]
cuda = "12.0"

[dependencies]
cmake = ">=3.24"
ninja = "*"
pkg-config = "*"

# Compilers / toolchain
cxx-compiler = "*"
cuda-nvcc = "*"
cuda-cudart-dev = "*"

# Optional but useful
python = ">=3.10"
numpy = "*"

[tasks]
configure = """
cmake -S . -B build -G Ninja \
  -DCMAKE_BUILD_TYPE=Release \
  -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
"""

build = { cmd = "cmake --build build -j", depends-on = ["configure"] }
clean = "rm -rf build"
reconfigure = { cmd = "rm -rf build && pixi run configure" }
